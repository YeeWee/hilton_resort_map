<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hilton Resort Credit 合格酒店地图</title>
  <link rel="stylesheet" href="vendor/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="vendor/leaflet.markercluster/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="vendor/leaflet.markercluster/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header id="topbar">
    <h1>Hilton Resort Credit 合格酒店地图</h1>
    <div id="stats">加载中…</div>
    <button id="sidebar-toggle" type="button" aria-controls="sidebar" aria-expanded="true">
      <span class="toggle-icon" aria-hidden="true">☰</span>
      <span class="toggle-label">收起侧边栏</span>
    </button>
  </header>
  <div id="layout">
    <aside id="sidebar" aria-label="酒店列表">
      <div class="drawer-head">
        <span class="drawer-title">筛选酒店</span>
        <button id="drawer-close" type="button" aria-label="关闭筛选抽屉">✕</button>
      </div>
      <details id="brand-strip" class="brand-filter" open>
        <summary>
          <span class="brand-strip-label">品牌筛选</span>
        </summary>
        <div id="brand-items"></div>
      </details>
      <div id="geo-toolbar">
        <span id="geo-hint">大洲 / 国家(勾选筛选)</span>
        <button id="geo-reset" type="button">重置筛选</button>
      </div>
      <nav id="geo-tree"></nav>
    </aside>
    <div id="map" aria-label="地图"></div>
  </div>
  <div id="drawer-backdrop" hidden aria-hidden="true"></div>
  <script src="vendor/leaflet/dist/leaflet.js"></script>
  <script src="vendor/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
  <script src="assets/main.js" defer></script>
</body>
</html>
