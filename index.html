<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hilton Resort Credit 合格酒店地图</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header id="topbar">
    <h1>Hilton Resort Credit 合格酒店地图</h1>
    <div id="stats">加载中…</div>
    <button id="sidebar-toggle" type="button" aria-controls="sidebar" aria-expanded="true">收起侧边栏</button>
  </header>
  <div id="layout">
    <aside id="sidebar" aria-label="酒店列表">
      <div id="geo-toolbar">
        <span id="geo-hint">大洲 / 国家(勾选筛选)</span>
        <button id="geo-reset" type="button">重置筛选</button>
      </div>
      <nav id="geo-tree"></nav>
    </aside>
    <div id="map" aria-label="地图"></div>
  </div>
  <!-- CDN 版本与 tests/page.test.js 的 CDN_FILES 本地副本一一对应,升级时两处同步 -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="assets/main.js" defer></script>
</body>
</html>
